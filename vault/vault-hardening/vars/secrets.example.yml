# Copy to secrets.yml and encrypt with ansible-vault before use.
# Prefer a short-lived administrative token with required sudo capabilities.
# A bootstrap root TOKEN can be used. Vault's internal root encryption key is not an API credential.
vault_admin_token: hvs.REPLACE_ME
vault_unseal_keys: []                     # Shamir shares only; enough to meet threshold.
